<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拼出一个 π · Build π Without π</title>
<style>
  :root {
    --ink: #2b2b2b;
    --dim: #777;
    --line: #e3e0da;
    --red: #c45a4a;
    --blue: #4a6fa5;
    --bg: #faf9f6;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header { text-align: center; padding: 16px 0 8px; position: relative; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: 2px; margin: 0; }
  header p { color: var(--dim); font-size: 14px; margin: 6px 0 0; }
  #lang-toggle {
    position: absolute; top: 14px; right: 0;
    font: inherit; font-size: 13px;
    padding: 4px 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  #lang-toggle:hover { border-color: var(--ink); }
  nav {
    display: flex; gap: 8px; justify-content: center;
    margin: 18px 0 22px; flex-wrap: wrap;
  }
  nav button {
    font: inherit; font-size: 15px;
    padding: 7px 18px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s;
  }
  nav button.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  section h2 { font-size: 18px; margin: 0 0 4px; }
  section .sub { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
  .formula {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 10px 0 16px;
    overflow-x: auto;
    white-space: nowrap;
  }
  /* KaTeX 挂载后：display 公式零边距、微放大 */
  .formula .katex-display { margin: 0; }
  .formula .katex { font-size: 1.18em; }
  .formula .katex-display > .katex { white-space: nowrap; }
  canvas { width: 100%; height: 300px; display: block; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; }
  .nums { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; margin-top: 14px; }
  .nums .row { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .nums .k { color: var(--dim); flex: 0 0 92px; }
  .nums .v { overflow-x: auto; white-space: nowrap; }
  .nums .sum .v { color: var(--red); font-weight: 700; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .btns button {
    font: inherit; font-size: 14px; padding: 6px 14px;
    border: 1px solid var(--line); background: var(--card); border-radius: 6px; cursor: pointer;
  }
  .btns button:hover { border-color: var(--ink); }
  .quiz-q { font-size: 17px; margin: 10px 0 16px; }
  textarea {
    width: 100%; min-height: 88px; font: inherit; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    background: var(--card); resize: vertical;
  }
  .reveal { border-left: 3px solid var(--red); padding: 2px 0 2px 14px; margin: 18px 0; }
  .reveal h3 { margin: 14px 0 6px; font-size: 15px; }
  .reveal p, .reveal li { font-size: 14.5px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 18px 12px;
    margin: 14px 0;
    scroll-margin-top: 12px;
  }
  .card h3 { font-size: 16px; margin: 12px 0 6px; }
  .card p { font-size: 14.5px; margin: 8px 0; }
  .toc {
    display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline;
    font-size: 13px; color: var(--dim);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; margin: 12px 0;
  }
  .toc a { color: var(--blue); text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  .e-demo { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 4px; }
  .e-demo h4 { font-size: 14px; margin: 10px 0 2px; }
  .glossary { padding-left: 20px; margin: 6px 0; }
  .glossary li { font-size: 14.5px; margin: 6px 0; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 40px; }
  @media (max-width: 480px) {
    h1 { font-size: 21px; }
    .nums { font-size: 11.5px; }
    .nums .k { flex-basis: 72px; }
    canvas { height: 240px; }
  }
</style>
  <style>/*__KATEX_CSS__*/</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="lang-toggle" data-i18n="lang.toggle">EN</button>
    <h1 data-i18n="app.title">π 在哪里？</h1>
    <p data-i18n="app.subtitle">两个「看不见 π」的数，能相加等于 π 吗？</p>
  </header>

  <nav>
    <button id="tab-cake" data-i18n="nav.cake">切蛋糕</button>
    <button id="tab-ladder" data-i18n="nav.ladder">莱布尼茨爬梯</button>
    <button id="tab-quiz" data-i18n="nav.quiz">出题</button>
    <button id="tab-why" data-i18n="nav.why">为什么</button>
  </nav>

  <!-- F2 切蛋糕 -->
  <section id="view-cake">
    <h2 data-i18n="cake.h2">切蛋糕</h2>
    <p class="sub" data-i18n="cake.sub"></p>
    <div class="formula" data-tex="A(c) = \int_0^c \frac{4}{1+x^2}\,dx \qquad B(c) = \int_c^1 \frac{4}{1+x^2}\,dx \qquad A + B = \pi">A(c) = ∫₀ᶜ 4/(1+x²) dx　　B(c) = ∫꜀¹ 4/(1+x²) dx　　A + B = π</div>
    <canvas id="cake-canvas"></canvas>
    <div class="nums">
      <div class="row"><span class="k" data-i18n="cake.k.c">c</span><span class="v" id="cake-c"></span></div>
      <div class="row"><span class="k" data-i18n="cake.k.A">A（红）</span><span class="v" id="cake-A"></span></div>
      <div class="row"><span class="k" data-i18n="cake.k.B">B（蓝）</span><span class="v" id="cake-B"></span></div>
      <div class="row sum"><span class="k" data-i18n="cake.k.sum">A + B</span><span class="v" id="cake-sum"></span></div>
      <div class="row"><span class="k" data-i18n="cake.k.pi">π（对照）</span><span class="v" id="cake-pi"></span></div>
    </div>
  </section>

  <!-- F3 莱布尼茨爬梯 -->
  <section id="view-ladder" hidden>
    <h2 data-i18n="lad.h2">莱布尼茨爬梯</h2>
    <p class="sub" data-i18n="lad.sub"></p>
    <div class="formula" data-tex="S_n = 4\left(1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} + \cdots \pm \frac{1}{2n-1}\right)">Sₙ = 4 × (1 − 1/3 + 1/5 − … ± 1/(2n−1))</div>
    <canvas id="lad-canvas"></canvas>
    <div class="btns">
      <button id="lad-plus1" data-i18n="lad.plus1">+1 项</button>
      <button id="lad-plus10" data-i18n="lad.plus10">+10 项</button>
      <button id="lad-plus100" data-i18n="lad.plus100">+100 项</button>
      <button id="lad-auto" data-i18n="lad.auto">自动步进</button>
      <button id="lad-reset" data-i18n="lad.reset">重置</button>
    </div>
    <div class="nums">
      <div class="row"><span class="k" data-i18n="lad.k.n">已加项数</span><span class="v" id="lad-n"></span></div>
      <div class="row"><span class="k" data-i18n="lad.k.next">下一项</span><span class="v" id="lad-next"></span></div>
      <div class="row sum"><span class="k" data-i18n="lad.k.S">部分和 Sₙ</span><span class="v" id="lad-S"></span></div>
      <div class="row"><span class="k" data-i18n="lad.k.diff">Sₙ − π</span><span class="v" id="lad-diff"></span></div>
    </div>
  </section>

  <!-- F4 出题 -->
  <section id="view-quiz" hidden>
    <h2 data-i18n="quiz.h2">出题</h2>
    <p class="quiz-q"><b data-i18n="quiz.question"></b></p>
    <p class="sub" data-i18n="quiz.sub"></p>
    <textarea id="quiz-input" data-i18n-placeholder="quiz.placeholder"></textarea>
    <div class="btns"><button id="quiz-btn" data-i18n="quiz.btn">揭晓答案</button></div>
    <div id="quiz-answer" hidden>
      <p data-i18n-html="quiz.badnews"></p>
      <div id="quiz-reveal" hidden>
        <div class="reveal">
          <h3 data-i18n="quiz.reveal.title1"></h3>
          <p data-i18n-html="quiz.reveal.body1"></p>
          <h3 data-i18n="quiz.reveal.title2"></h3>
          <p data-i18n-html="quiz.reveal.body2"></p>
          <h3 data-i18n="quiz.reveal.title3"></h3>
          <p data-i18n-html="quiz.reveal.body3"></p>
          <p data-i18n="quiz.reveal.close"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- F8 为什么 -->
  <section id="view-why" hidden>
    <h2 data-i18n="why.h2">为什么？</h2>
    <p class="sub" data-i18n-html="why.intro"></p>
    <nav class="toc">
      <span class="toc-label" data-i18n="why.toc.label">本页目录</span>
      <a href="#why-s1" data-i18n="why.t1"></a>
      <a href="#why-s2" data-i18n="why.t2"></a>
      <a href="#why-s3" data-i18n="why.t3"></a>
      <a href="#why-s4" data-i18n="why.t4"></a>
      <a href="#why-s5" data-i18n="why.t5"></a>
    </nav>
    <div class="card" id="why-s1">
      <h3 data-i18n="why.s1.title"></h3>
      <p data-i18n-html="why.s1.p1"></p>
      <p data-i18n-html="why.s1.p2"></p>
      <p data-i18n-html="why.s1.p3"></p>
    </div>
    <div class="card" id="why-s2">
      <h3 data-i18n="why.s2.title"></h3>
      <p data-i18n-html="why.s2.p1"></p>
      <p data-i18n-html="why.s2.p2"></p>
      <p data-i18n-html="why.s2.p3"></p>
    </div>
    <div class="card" id="why-s3">
      <h3 data-i18n="why.s3.title"></h3>
      <p data-i18n-html="why.s3.p1"></p>
      <p data-i18n-html="why.s3.p2"></p>
      <p data-i18n-html="why.s3.p3"></p>
    </div>
    <div class="card" id="why-s4">
      <h3 data-i18n="why.s4.title"></h3>
      <p data-i18n-html="why.s4.p1"></p>
      <p data-i18n-html="why.s4.p2"></p>
      <p data-i18n-html="why.s4.p3"></p>
      <p data-i18n-html="why.s4.p4"></p>
      <div class="e-demo">
        <h4 data-i18n="why.e.title"></h4>
        <p class="sub" data-i18n="why.e.sub"></p>
        <div class="nums">
          <div class="row"><span class="k" data-i18n="why.e.k.e"></span><span class="v" id="why-e"></span></div>
          <div class="row"><span class="k" data-i18n="why.e.k.head"></span><span class="v" id="why-e-head"></span></div>
          <div class="row sum"><span class="k" data-i18n="why.e.k.tail"></span><span class="v" id="why-e-tail"></span></div>
        </div>
        <p class="sub" data-i18n="why.e.close"></p>
      </div>
    </div>
    <div class="card" id="why-s5">
      <h3 data-i18n="why.s5.title"></h3>
      <ul class="glossary">
        <li data-i18n-html="why.g.algebraic"></li>
        <li data-i18n-html="why.g.transcendental"></li>
        <li data-i18n-html="why.g.indep"></li>
        <li data-i18n-html="why.g.computable"></li>
      </ul>
    </div>
  </section>

  <footer data-i18n="app.footer">where-is-pi · 纯静态单文件 · 无网络请求</footer>
</div>
<script>
window.__TEX__ = /*__TEX__*/null;

</body>
</html>
